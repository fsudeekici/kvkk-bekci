[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvkk-bekci"
version = "0.1.0"
description = "Find, score and mask personal data (KVKK) in SQLite databases"
requires-python = ">=3.10"
dependencies = ["faker>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kvkk-bekci = "kvkk_bekci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
